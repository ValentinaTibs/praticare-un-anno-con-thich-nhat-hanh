name: community_app
description: Community mobile application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3

  # Real-time
  socket_io_client: ^2.0.3+1

  # Firebase (email+password authentication and push notifications)
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.6
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.1.2

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.2

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
