name: community_app
description: Community mobile application
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3


  # Firebase (email+password authentication and push notifications)
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.6
  firebase_messaging: ^14.9.1
  flutter_local_notifications: ^17.1.2

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Font licenses, shown in the app's license page (SIL Open Font License).
  assets:
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Literata-OFL.txt

  # "Lanterna" style fonts (docs/design-lanterna.md), bundled so the app works
  # offline and never calls Google Fonts.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
